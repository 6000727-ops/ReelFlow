plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.mirzaev.reelflow'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.mirzaev.reelflow'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
